<!doctype html>
<html lang="en-AU">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>cherry's labs — store</title>
        <meta name="description" content="cherry's labs - store" />
        <meta name="author" content="Elphiene" />
        <meta name="year" content="2026" />
        <link rel="icon" type="image/x-icon" href="images/icons/favicon.png" />
        <link rel="stylesheet" href="style.css" />
        <style>
            /* ── header: horizontal ── */
            header { text-align: left; padding: 12px var(--spacing-md); }
            .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
            header .logo { max-width: 160px; margin-bottom: 0; }
            header nav { justify-content: flex-end; flex-wrap: nowrap; gap: var(--spacing-xs); }
            body { padding-top: 90px; }
            .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; border-radius: 6px; }
            .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--color-text); border-radius: 2px; transition: all 0.25s; }
            .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
            .nav-toggle.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
            .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
            @media (max-width: 768px) {
                body { padding-top: 60px; }
                .nav-toggle { display: flex; }
                header nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; background: rgba(8,8,8,0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(236,72,153,0.3); padding: 8px 16px 16px; gap: 0; }
                header nav.open { display: flex; }
                header nav a { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); border-radius: 0; }
                header nav a:last-child { border-bottom: none; }
            }

            /* ── store page extras ── */
            .store-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: var(--spacing-md);
            }

            .product-card {
                display: flex;
                flex-direction: column;
                gap: var(--spacing-xs);
            }

            .product-card img {
                width: 100%;
                aspect-ratio: 1/1;
                object-fit: cover;
                border-radius: calc(var(--radius) / 2);
                border: 1px solid var(--border-color-white);
            }

            .product-card .price {
                font-size: var(--font-size-base);
                color: var(--color-pink);
                font-weight: bold;
            }

            .tags {
                display: flex;
                gap: var(--spacing-xs);
                flex-wrap: wrap;
            }

            .tag {
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 20px;
                border: 1px solid var(--border-color-white);
                color: #ccc;
            }

            .tag.type-3dprint { border-color: var(--color-purple); color: var(--color-purple); }
            .tag.type-gadget  { border-color: var(--color-pink);   color: var(--color-pink);   }

            @media (max-width: 480px) {
                .store-grid { grid-template-columns: 1fr; }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="header-inner">
                <img src="images/logos/cherrys-labs.png" alt="cherry's labs" class="logo" />
                <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <nav id="main-nav">
                    <a href="index.html">home</a>
                    <a href="hardware.html">hardware</a>
                    <a href="software.html">software</a>
                    <a href="store.html">store</a>
                    <a href="wiki.html">wiki</a>
                </nav>
            </div>
        </header>

        <main>
            <section>
                <h2>store</h2>
                <p style="color:#888; font-size:14px; margin-bottom: var(--spacing-md);">3D printed items and gadgets/tech.</p>

                <!-- ─────────────────────────────────────────
                     STORE GRID
                     To add a product: copy the PRODUCT CARD TEMPLATE below.
                     Category tags: type-3dprint / type-gadget
                ───────────────────────────────────────── -->
                <div class="store-grid">

                    <!-- PRODUCT CARD TEMPLATE — copy this block and fill in details
                    <div class="card product-card">
                        <img src="path/to/photo.jpg" alt="product name" />
                        <div class="tags">
                            <span class="tag type-3dprint">3d print</span>
                        </div>
                        <h3>product name</h3>
                        <p>Short description.</p>
                        <span class="price">$0.00</span>
                    </div>
                    -->

                    <div class="card product-card" style="align-items:center; justify-content:center; text-align:center; min-height:180px;">
                        <h3 style="color:#555; font-size:16px;">coming soon</h3>
                        <p style="color:#444; font-size:13px;">products are on the way.</p>
                    </div>

                </div>
            </section>
        </main>

        <footer>
            <p>
                webmaster: <a href="https://elphiene.com">elphiene</a>
                | 2026 | <a href="https://cherrysofa.com">cherrysofa.com</a>
            </p>
        </footer>

        <script>
            const toggle = document.querySelector('.nav-toggle');
            const nav    = document.getElementById('main-nav');
            toggle.addEventListener('click', () => {
                const open = nav.classList.toggle('open');
                toggle.classList.toggle('active', open);
                toggle.setAttribute('aria-expanded', String(open));
            });
            document.addEventListener('click', (e) => {
                if (!toggle.contains(e.target) && !nav.contains(e.target)) {
                    nav.classList.remove('open');
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.card').forEach((card, i) => {
                    card.style.animationDelay = `${i * 0.1}s`;
                });
            });
        </script>
    </body>
</html>
