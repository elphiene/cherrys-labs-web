<!doctype html>
<html lang="en-AU">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>cherry's labs — hardware</title>
        <meta name="description" content="cherry's labs - hardware builds, 3D prints, and physical projects." />
        <meta name="author" content="Elphiene" />
        <meta name="year" content="2026" />
        <link rel="icon" type="image/x-icon" href="images/icons/favicon.png" />
        <link rel="stylesheet" href="style.css" />
        <style>
            /* ── header: horizontal ── */
            header { text-align: left; padding: 12px var(--spacing-md); }
            .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
            header .logo { max-width: 160px; margin-bottom: 0; }
            header nav { justify-content: flex-end; flex-wrap: nowrap; gap: var(--spacing-xs); }
            body { padding-top: 90px; }

            .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; border-radius: 6px; }
            .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--color-text); border-radius: 2px; transition: all 0.25s; }
            .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
            .nav-toggle.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
            .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

            @media (max-width: 768px) {
                body { padding-top: 60px; }
                .nav-toggle { display: flex; }
                header nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; background: rgba(8,8,8,0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(236,72,153,0.3); padding: 8px 16px 16px; gap: 0; }
                header nav.open { display: flex; }
                header nav a { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); border-radius: 0; }
                header nav a:last-child { border-bottom: none; }
            }

            /* ── hardware grid ── */
            .hardware-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: var(--spacing-md);
            }

            .hardware-card {
                display: flex;
                flex-direction: column;
                padding: 0;
                overflow: hidden;
            }

            .card-image {
                width: 100%;
                aspect-ratio: 16/9;
                background: #0a0a0a;
                display: flex;
                align-items: center;
                justify-content: center;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                overflow: hidden;
                flex-shrink: 0;
            }

            .card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
            .hardware-card:hover .card-image img { transform: scale(1.04); }
            .img-placeholder { font-family: var(--font-mono); font-size: 11px; color: #222; user-select: none; }

            .card-body {
                padding: var(--spacing-md);
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: 1;
            }

            .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

            .tag {
                font-family: var(--font-mono);
                font-size: 11px;
                padding: 2px 7px;
                border-radius: 4px;
                border: 1px solid rgba(255,255,255,0.1);
                color: #888;
                background: rgba(255,255,255,0.03);
            }

            .tag.status-wip      { border-color: #f59e0b; color: #f59e0b; background: rgba(245,158,11,0.07); }
            .tag.status-complete { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.07); }
            .tag.status-on-hold  { border-color: #6b7280; color: #6b7280; background: rgba(107,114,128,0.07); }

            .card-body h3 { font-size: 17px; margin: 0; }
            .card-body p  { font-size: 13px; color: #aaa; line-height: 1.55; margin: 0; flex: 1; }

            .card-links { display: flex; gap: var(--spacing-sm); padding-top: 4px; }
            .card-links a { font-family: var(--font-mono); font-size: 12px; color: #666; transition: color 0.2s; }
            .card-links a:hover { color: var(--color-pink); text-decoration: none; }

            @media (max-width: 480px) { .hardware-grid { grid-template-columns: 1fr; } }
        </style>
    </head>
    <body>
        <header>
            <div class="header-inner">
                <img src="images/logos/cherrys-labs.png" alt="cherry's labs" class="logo" />
                <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <nav id="main-nav">
                    <a href="index.html">home</a>
                    <a href="hardware.html">hardware</a>
                    <a href="software.html">software</a>
                    <a href="store.html">store</a>
                    <a href="wiki.html">wiki</a>
                </nav>
            </div>
        </header>

        <main>
            <section>
                <h2>hardware</h2>

                <!-- ─────────────────────────────────────────
                     HARDWARE GRID
                     Physical builds, 3D prints, maker projects.
                     To add a build: copy one .card.hardware-card block.
                     Status tags: status-wip / status-complete / status-on-hold
                ───────────────────────────────────────── -->
                <div class="hardware-grid">

                    <!-- HARDWARE CARD TEMPLATE
                    <div class="card hardware-card">
                        <div class="card-image">
                            <img src="images/projects/project-name.jpg" alt="project name" />
                        </div>
                        <div class="card-body">
                            <div class="tags">
                                <span class="tag status-wip">wip</span>
                                <span class="tag">3d print</span>
                            </div>
                            <h3>project title</h3>
                            <p>Short description.</p>
                            <div class="card-links">
                                <a href="#">github ↗</a>
                            </div>
                        </div>
                    </div>
                    -->

                    <div class="card hardware-card" style="align-items:center; justify-content:center; text-align:center; min-height:180px; padding: var(--spacing-md);">
                        <div class="card-body" style="align-items:center; text-align:center;">
                            <h3 style="color:#555; font-size:16px;">coming soon</h3>
                            <p style="color:#444; font-size:13px;">hardware builds are on the way.</p>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <footer>
            <p>
                webmaster: <a href="https://elphiene.com">elphiene</a>
                | 2026 | <a href="https://cherrysofa.com">cherrysofa.com</a>
            </p>
        </footer>

        <script>
            const toggle = document.querySelector('.nav-toggle');
            const nav    = document.getElementById('main-nav');
            toggle.addEventListener('click', () => {
                const open = nav.classList.toggle('open');
                toggle.classList.toggle('active', open);
                toggle.setAttribute('aria-expanded', String(open));
            });
            document.addEventListener('click', (e) => {
                if (!toggle.contains(e.target) && !nav.contains(e.target)) {
                    nav.classList.remove('open');
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.card').forEach((card, i) => {
                    card.style.animationDelay = `${i * 0.1}s`;
                });
            });
        </script>
    </body>
</html>
