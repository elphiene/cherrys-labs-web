<!doctype html>
<html lang="en-AU">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>mockup — intro cover</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #000; color: #fff; font-family: 'Courier New', monospace; padding-top: 90px; }

            #intro-cover {
                position: fixed;
                inset: 0;
                z-index: 9999;
                background: #000;
                will-change: transform, opacity;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #intro-cover-text {
                font-size: clamp(22px, 5vw, 56px);
                color: #fff;
                text-align: center;
                padding: 0 24px;
                letter-spacing: 0.05em;
            }
            #intro-spacer {
                height: 100vh;
                pointer-events: none;
            }

            #site-title {
                font-size: 28px;
                color: #ec4899;
                text-align: center;
                margin-bottom: 8px;
                opacity: 0;
            }
            .section-label {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.15em;
                color: #ec4899;
                text-align: center;
                margin-bottom: 16px;
            }
            .placeholder-cards {
                display: flex;
                gap: 16px;
                justify-content: center;
                flex-wrap: wrap;
                max-width: 900px;
                margin: 0 auto 60px;
                padding: 0 24px;
            }
            .placeholder-card {
                width: 280px;
                padding: 24px;
                border: 1px solid rgba(255,255,255,0.07);
                border-radius: 10px;
                background: rgba(18,18,18,0.82);
                text-align: center;
                color: #555;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div id="intro-cover">
            <span id="intro-cover-text">welcome to cherry's labs</span>
        </div>

        <main style="max-width:900px; margin:0 auto; padding:0 24px;">
            <section style="margin-bottom:40px;">
                <h2 id="site-title">welcome to cherry's labs</h2>
                <p class="section-label">the team</p>
                <div class="placeholder-cards">
                    <div class="placeholder-card">cherry</div>
                    <div class="placeholder-card">el</div>
                </div>
            </section>
            <p style="color:#333; text-align:center; font-size:13px;">↑ scroll up to replay</p>
        </main>

        <script>
            (function () {
                const cover     = document.getElementById("intro-cover");
                const coverText = document.getElementById("intro-cover-text");
                const siteTitle = document.getElementById("site-title");

                document.documentElement.style.overflow = "hidden";
                document.body.style.overflow = "hidden";

                const THRESHOLD = Math.min(window.innerHeight * 0.55, 320);
                let accumulated = 0;
                let dismissed   = false;

                function setProgress(p) {
                    p = Math.min(Math.max(p, 0), 1);
                    cover.style.transform   = `translateY(-${p * 100}%)`;
                    coverText.style.opacity = String(Math.max(0, 1 - p * 3));
                    siteTitle.style.opacity = String(Math.min(Math.max((p - 0.5) * 2, 0), 1));
                }

                function animateDismiss() {
                    dismissed = true;
                    const startP = accumulated / THRESHOLD;
                    const start  = performance.now();
                    const dur    = 380;
                    function step(now) {
                        const t     = Math.min((now - start) / dur, 1);
                        const eased = 1 - Math.pow(1 - t, 3);
                        setProgress(startP + (1 - startP) * eased);
                        if (t < 1) {
                            requestAnimationFrame(step);
                        } else {
                            cover.remove();
                            siteTitle.style.opacity = "1";
                            document.documentElement.style.overflow = "";
                            document.body.style.overflow = "";
                        }
                    }
                    requestAnimationFrame(step);
                }

                function addDelta(dy) {
                    if (dismissed) return;
                    accumulated = Math.max(0, accumulated + dy);
                    setProgress(accumulated / THRESHOLD);
                    if (accumulated >= THRESHOLD) animateDismiss();
                }

                window.addEventListener("wheel", (e) => addDelta(e.deltaY), { passive: true });

                let lastY = null;
                window.addEventListener("touchstart", (e) => { lastY = e.touches[0].clientY; }, { passive: true });
                window.addEventListener("touchmove", (e) => {
                    if (lastY === null) return;
                    addDelta(lastY - e.touches[0].clientY);
                    lastY = e.touches[0].clientY;
                }, { passive: true });
                window.addEventListener("touchend", () => { lastY = null; }, { passive: true });
            })();
        </script>
    </body>
</html>
